name: Cloudflare R2 image sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Do not orange-cloud the Vercel hostname. This job only writes R2 objects.
concurrency:
  group: r2-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-r2-images:
    name: Sync git images to Cloudflare R2
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      R2_BUCKET: realestatedomains-assets
      NEXT_PUBLIC_R2_PREFIX: midtownvegascondos
      # Invoice-verified Cloudflare account (not a secret). Lets REST/S3
      # skip the IP-blocked /accounts lookup.
      CLOUDFLARE_ACCOUNT_ID: 2cc579c1ec9e426ed585e933ebf4753b
      R2_ACCOUNT_ID: 2cc579c1ec9e426ed585e933ebf4753b
      # Native Vercel GitHub project (repo VERCEL_PROJECT_ID secret is stale).
      VERCEL_ORG_ID: team_EIbjFXaDDtGMTweb5Hvo3CG3
      VERCEL_PROJECT_ID: prj_cgzb65mf2GDFh37vU9hPWQ2TGJ6m
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Export GitHub Cloudflare secrets
        id: gh
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mask_export() {
            local key="$1"
            local val="$2"
            [ -z "$val" ] && return
            echo "::add-mask::$val"
            printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
          }
          mask_export CLOUDFLARE_API_TOKEN "$TOKEN"
          if [ -n "$ACCOUNT" ]; then
            mask_export CLOUDFLARE_ACCOUNT_ID "$ACCOUNT"
            mask_export R2_ACCOUNT_ID "$ACCOUNT"
          fi
          mask_export R2_ACCESS_KEY_ID "$R2_KEY"
          mask_export R2_SECRET_ACCESS_KEY "$R2_SECRET"
          if { [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; } || { [ -n "$R2_KEY" ] && [ -n "$R2_SECRET" ] && [ -n "$ACCOUNT" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Cloudflare keys from Vercel production env
        if: steps.gh.outputs.configured != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN; cannot pull Vercel env."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g vercel@latest
          if ! vercel env pull /tmp/vercel-prod.env --environment=production --yes --token="$VERCEL_TOKEN"; then
            echo "Vercel production env pull failed."
            exit 0
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              CLOUDFLARE_API_TOKEN=*|CLOUDFLARE_ACCOUNT_ID=*|R2_ACCOUNT_ID=*|R2_ACCESS_KEY_ID=*|R2_SECRET_ACCESS_KEY=*)
                key="${line%%=*}"
                val="${line#*=}"
                val="${val#\"}"
                val="${val%\"}"
                if [ "$val" = "[SENSITIVE]" ] || [ -z "$val" ]; then
                  echo "skipped $key (not usable from vercel env pull)"
                  continue
                fi
                echo "::add-mask::$val"
                printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
                echo "copied $key"
                ;;
            esac
          done < /tmp/vercel-prod.env
          rm -f /tmp/vercel-prod.env
        id: vercelenv

      - name: Resolve R2 auth
        id: cf
        run: |
          TOKEN_OK=false
          S3_OK=false
          # Token-only is enough to attempt whoami / wrangler put; account id is resolved in the script.
          [ -n "$CLOUDFLARE_API_TOKEN" ] && TOKEN_OK=true
          [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID$R2_ACCOUNT_ID" ] && S3_OK=true
          echo "token_auth=$TOKEN_OK"
          echo "s3_auth=$S3_OK"
          if [ "$TOKEN_OK" = true ] || [ "$S3_OK" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare R2 credentials were not in GitHub Production secrets or Vercel production env."
          fi

      - name: Install dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Upload public/images to R2
        if: steps.cf.outputs.configured == 'true'
        run: npm run cloudflare:images

      - name: Probe public R2 object
        if: always()
        env:
          # Do not inherit API tokens into this step's logged env dump.
          CLOUDFLARE_API_TOKEN: ""
          R2_ACCESS_KEY_ID: ""
          R2_SECRET_ACCESS_KEY: ""
        run: |
          URL="https://pub-720ca9b7443b47be981def05abd3d7f0.r2.dev/midtownvegascondos/images/hero/home-strip-dusk.webp"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$URL")
          echo "R2 public object HTTP $CODE for $URL"
          if [ "$CODE" = "200" ]; then
            echo "Site images are live on Cloudflare R2."
          else
            echo "::warning::Cloudflare R2 site images are not live (HTTP $CODE). The Account API token cannot write R2 (401/10000). Do not retry Images/Pages/Workers/DNS with that token (it already hit 429 too-many-auth-failures). Create R2 S3 keys (dashboard → R2 → Manage R2 API Tokens) and set R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY on Vercel production + the Production GitHub Environment. Then re-run this workflow and set NEXT_PUBLIC_R2_ENABLED=true. Git public/images remains the fallback. Do not orange-cloud the Vercel hostname."
          fi
          PAGES_URL="https://midtownvegascondos-heading-photos.pages.dev/images/hero/home-strip-dusk.webp"
          PAGES_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PAGES_URL" || true)
          echo "Cloudflare Pages image host HTTP ${PAGES_CODE:-000} for $PAGES_URL"
          if [ "$PAGES_CODE" = "200" ]; then
            echo "Heading photos are live on Cloudflare Pages. Set NEXT_PUBLIC_CF_PAGES_IMAGES_ENABLED=true and NEXT_PUBLIC_CF_PAGES_IMAGES_BASE=https://midtownvegascondos-heading-photos.pages.dev"
          fi
          EDGE_URL="https://img.midtownvegascondos.com/images/hero/home-strip-dusk.webp"
          EDGE_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$EDGE_URL" || true)
          echo "Cloudflare img hostname HTTP ${EDGE_CODE:-000} for $EDGE_URL"
          if [ "$EDGE_CODE" = "200" ]; then
            echo "Heading photos are cached on Cloudflare via img.midtownvegascondos.com. Set NEXT_PUBLIC_CF_EDGE_IMAGES_ENABLED=true"
          fi
